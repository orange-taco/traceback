services:
  app:
    build: !reset null
    image: ${APP_IMAGE:?APP_IMAGE is required}
    command: !reset []
    depends_on: !reset []
    env_file:
      - .env
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports: !reset []
    volumes: !reset []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  db: !reset null
