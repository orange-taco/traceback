services:
  app:
    build: !reset null
    image: ${APP_IMAGE:?APP_IMAGE is required}
    command: !reset []
    depends_on: !reset []
    env_file: !reset []
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      TRACEBACK_DATABASE_URL: ${TRACEBACK_DATABASE_URL:?TRACEBACK_DATABASE_URL is required}
      DJANGO_SETTINGS_MODULE: config.settings.production
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports: !reset []
    volumes: !reset []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  db: !reset null
