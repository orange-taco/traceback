default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types: [python]
      - id: yamllint
        name: YAML lint
        entry: uv run yamllint .
        language: system
        pass_filenames: false
        types: [yaml]
      - id: django-check
        name: Django system check
        entry: uv run python manage.py check --settings=config.settings.test
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
