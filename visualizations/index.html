h2,
h3,
h4,
h5,
h6,

b,

.card {

  corner-shape: var(--corner-shape);

  max-width: none !important;

  padding: 0 !important;
  border: 0 !important;

  background: transparent !important;

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #auth-flow-visualizer {

    @media (max-width: 620px) { #auth-flow-visualizer .af-label { font-size: 12px; } #auth-flow-visualizer .af-sub { font-size: 9px; } #auth-flow-visualizer .af-rationale { grid-template-columns: 1fr; } #auth-flow-visualizer .af-reason::after { content: &quot;↓&quot;; right: auto; left: 50%; top: auto; bottom: -14px; transform: translateX(-50%); } #auth-flow-visualizer .af-reason:last-child::after { display: none; } #auth-flow-visualizer .af-steps { grid-template-columns: 1fr; } #auth-flow-visualizer .af-step::after, #auth-flow-visualizer .af-step:nth-child(2)::after, #auth-flow-visualizer .af-step:nth-child(4)::after { content: &quot;↓&quot;; display: block; right: auto; top: auto; bottom: -22px; left: 50%; transform: translateX(-50%); } #auth-flow-visualizer .af-step:last-child::after { display: none; } }

  &lt;h2 id=&quot;auth-flow-title&quot;&gt;TRACEBACK account unlink&lt;/h2&gt;
  &lt;div class=&quot;af-controls&quot; role=&quot;group&quot; aria-label=&quot;Account type&quot;&gt;
    &lt;button type=&quot;button&quot; data-flow=&quot;kakao-only&quot; aria-pressed=&quot;true&quot;&gt;Kakao-only&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-flow=&quot;email-kakao&quot; aria-pressed=&quot;false&quot;&gt;Email + Kakao&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class=&quot;af-explainer&quot;&gt;
    &lt;p class=&quot;af-intro&quot;&gt;버튼을 누른 브라우저 요청이 어떤 코드와 서비스로 이동하는지 단계별로 읽어보세요. 카드 위 색상은 실행 주체를 뜻합니다.&lt;/p&gt;
    &lt;div class=&quot;af-legend-row&quot; aria-label=&quot;Flow ownership legend&quot;&gt;
      &lt;span class=&quot;af-owner frontend&quot;&gt;브라우저 / API endpoint&lt;/span&gt;
      &lt;span class=&quot;af-owner library&quot;&gt;allauth 라이브러리&lt;/span&gt;
      &lt;span class=&quot;af-owner custom&quot;&gt;TRACEBACK 코드&lt;/span&gt;
      &lt;span class=&quot;af-owner external&quot;&gt;Kakao 외부 서비스&lt;/span&gt;
      &lt;span class=&quot;af-owner database&quot;&gt;우리 DB 상태&lt;/span&gt;
    &lt;/div&gt;
    &lt;section class=&quot;af-route&quot; data-flow-panel=&quot;kakao-only&quot; aria-labelledby=&quot;kakao-delete-title&quot;&gt;
      &lt;h3 class=&quot;af-route-title&quot; id=&quot;kakao-delete-title&quot;&gt;Kakao-only 계정 삭제&lt;/h3&gt;
      &lt;p class=&quot;af-route-note&quot;&gt;계정 삭제는 provider 연결 해제와 별도 endpoint입니다. Kakao 연결 해제가 성공한 뒤에만 로컬 계정을 정리합니다.&lt;/p&gt;
      &lt;div class=&quot;af-steps&quot;&gt;
        &lt;article class=&quot;af-step frontend&quot;&gt;&lt;span class=&quot;af-step-number&quot;&gt;01 · 시작&lt;/span&gt;&lt;h4&gt;사용자 브라우저&lt;/h4&gt;&lt;p&gt;사용자가 “계정 삭제”를 누릅니다.&lt;/p&gt;&lt;code&gt;DELETE /accounts/delete&lt;/code&gt;&lt;/article&gt;
        &lt;article class=&quot;af-step custom&quot;&gt;&lt;span class=&quot;af-step-number&quot;&gt;02 · 진입점&lt;/span&gt;&lt;h4&gt;AccountDeletionView&lt;/h4&gt;&lt;p&gt;로그인과 CSRF를 확인하고 삭제 서비스를 호출합니다.&lt;/p&gt;&lt;code&gt;apps/accounts/views.py&lt;/code&gt;&lt;/article&gt;
        &lt;article class=&quot;af-step custom&quot;&gt;&lt;span class=&quot;af-step-number&quot;&gt;03 · 원격 먼저&lt;/span&gt;&lt;h4&gt;unlink_kakao_user()&lt;/h4&gt;&lt;p&gt;서버의 Kakao Admin Key로 동의 철회를 요청합니다.&lt;/p&gt;&lt;code&gt;apps/accounts/providers.py&lt;/code&gt;&lt;/article&gt;
        &lt;article class=&quot;af-step external&quot;&gt;&lt;span class=&quot;af-step-number&quot;&gt;04 · 외부 확인&lt;/span&gt;&lt;h4&gt;Kakao API&lt;/h4&gt;&lt;p&gt;성공한 사용자 ID를 반환합니다. 이미 끊겼으면 -101도 성공으로 봅니다.&lt;/p&gt;&lt;code&gt;POST /v1/user/unlink&lt;/code&gt;&lt;/article&gt;
        &lt;article class=&quot;af-step database&quot;&gt;&lt;span class=&quot;af-step-number&quot;&gt;05 · 로컬 정리&lt;/span&gt;&lt;h4&gt;우리 DB + 세션&lt;/h4&gt;&lt;p&gt;사용자를 익명화·비활성화하고 연결·이메일·세션을 정리합니다.&lt;/p&gt;&lt;code&gt;apps/accounts/services.py · atomic()&lt;/code&gt;&lt;/article&gt;
      &lt;/div&gt;
      &lt;p class=&quot;af-branch&quot;&gt;&lt;strong&gt;실패하면:&lt;/strong&gt; Kakao 오류는 &lt;code&gt;503 provider_unavailable&lt;/code&gt;로 응답하고 로컬 익명화는 시작하지 않습니다.&lt;/p&gt;
    &lt;/section&gt;
    &lt;section class=&quot;af-route&quot; data-flow-panel=&quot;email-kakao&quot; hidden aria-labelledby=&quot;provider-disconnect-title&quot;&gt;
      &lt;h3 class=&quot;af-route-title&quot; id=&quot;provider-disconnect-title&quot;&gt;Email + Kakao 연결 해제&lt;/h3&gt;
      &lt;p class=&quot;af-route-note&quot;&gt;이 경로는 계정 삭제가 아니라 Kakao 연결만 해제합니다. 이메일 로그인은 유지됩니다.&lt;/p&gt;
      &lt;div class=&quot;af-steps&quot;&gt;
        &lt;article class=&quot;af-step frontend&quot;&gt;&lt;span class=&quot;af-step-number&quot;&gt;01 · 시작&lt;/span&gt;&lt;h4&gt;사용자 브라우저&lt;/h4&gt;&lt;p&gt;사용자가 “Kakao 연결 해제”를 누릅니다.&lt;/p&gt;&lt;code&gt;DELETE /_allauth/browser/v1/account/providers&lt;/code&gt;&lt;/article&gt;
        &lt;article class=&quot;af-step library&quot;&gt;&lt;span class=&quot;af-step-number&quot;&gt;02 · 검증&lt;/span&gt;&lt;h4&gt;allauth Headless&lt;/h4&gt;&lt;p&gt;provider와 account를 확인하고 계정 상태를 검증합니다.&lt;/p&gt;&lt;code&gt;DeleteProvider · Input.clean()&lt;/code&gt;&lt;/article&gt;
        &lt;article class=&quot;af-step custom&quot;&gt;&lt;span class=&quot;af-step-number&quot;&gt;03 · 정책&lt;/span&gt;&lt;h4&gt;SocialAccountAdapter&lt;/h4&gt;&lt;p&gt;Social-only 계정의 password 조건을 확인합니다.&lt;/p&gt;&lt;code&gt;apps/accounts/adapters.py&lt;/code&gt;&lt;/article&gt;
        &lt;article class=&quot;af-step custom&quot;&gt;&lt;span class=&quot;af-step-number&quot;&gt;04 · 원격&lt;/span&gt;&lt;h4&gt;unlink_kakao_user()&lt;/h4&gt;&lt;p&gt;Kakao 동의를 철회합니다. -101은 이미 목표 상태입니다.&lt;/p&gt;&lt;code&gt;Admin Key POST&lt;/code&gt;&lt;/article&gt;
        &lt;article class=&quot;af-step database&quot;&gt;&lt;span class=&quot;af-step-number&quot;&gt;05 · 완료&lt;/span&gt;&lt;h4&gt;SocialAccount 삭제&lt;/h4&gt;&lt;p&gt;원격 성공 뒤 우리 DB에서 Kakao 연결 행만 삭제합니다.&lt;/p&gt;&lt;code&gt;connect.disconnect()&lt;/code&gt;&lt;/article&gt;
      &lt;/div&gt;
      &lt;p class=&quot;af-branch&quot;&gt;&lt;strong&gt;Social-only 계정이면:&lt;/strong&gt; allauth가 &lt;code&gt;400 no_password&lt;/code&gt;를 반환하며 Kakao 연결은 유지됩니다.&lt;/p&gt;
    &lt;/section&gt;
  &lt;/div&gt;

  &lt;div class=&quot;af-rationale&quot; aria-label=&quot;Why the unlink order is remote first&quot;&gt;
    &lt;div class=&quot;af-reason&quot;&gt;&lt;span class=&quot;af-reason-index&quot;&gt;01&lt;/span&gt;&lt;strong&gt;Remote state first&lt;/strong&gt;&lt;p&gt;Kakao 동의철회는 우리 DB transaction으로 되돌릴 수 없는 외부 변경입니다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;af-reason&quot;&gt;&lt;span class=&quot;af-reason-index&quot;&gt;02&lt;/span&gt;&lt;strong&gt;-101 is idempotent success&lt;/strong&gt;&lt;p&gt;이미 연결이 끊겼다면 목표 상태에 도달한 것이므로 HTTP 400이어도 계속 진행합니다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;af-reason&quot;&gt;&lt;span class=&quot;af-reason-index&quot;&gt;03&lt;/span&gt;&lt;strong&gt;Local state is atomic&lt;/strong&gt;&lt;p&gt;원격 성공 뒤 User·SocialAccount·EmailAddress·UserSession을 한 transaction으로 정리합니다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p class=&quot;af-status&quot; aria-live=&quot;polite&quot; data-status&gt;현재 흐름: Kakao-only 계정 삭제 · 원격 연결 해제 후 로컬 계정 정리&lt;/p&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;auth-flow-visualizer&quot;);
      if (!root) return;
      const buttons = [...root.querySelectorAll(&quot;button[data-flow]&quot;)];
      const panels = [...root.querySelectorAll(&quot;[data-panel]&quot;)];
      const status = root.querySelector(&quot;[data-status]&quot;);
      const messages = { &quot;kakao-only&quot;: &quot;현재 흐름: Kakao-only 계정 삭제 · 원격 연결 해제 후 로컬 계정 정리&quot;, &quot;email-kakao&quot;: &quot;현재 흐름: Email + Kakao 연결 해제 · 이메일 로그인은 유지&quot; };
      buttons.forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; {
        const selected = button.dataset.flow;
        buttons.forEach((item) =&gt; item.setAttribute(&quot;aria-pressed&quot;, String(item === button)));
        panels.forEach((panel) =&gt; { panel.toggleAttribute(&quot;hidden&quot;, panel.dataset.panel !== selected); });
        root.querySelectorAll(&quot;[data-flow-panel]&quot;).forEach((panel) =&gt; { panel.toggleAttribute(&quot;hidden&quot;, panel.dataset.flowPanel !== selected); });
        if (status) status.textContent = messages[selected] || &quot;&quot;;
      }));
    })();
  &lt;/script&gt;
&lt;/div&gt;
      &lt;/section&gt;
    &lt;/main&gt;
  &lt;/div&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;traceback-guide&quot;);
      if (!root) return;
      const buttons = [...root.querySelectorAll(&quot;[data-guide-page]&quot;)];
      const panels = [...root.querySelectorAll(&quot;[data-guide-panel]&quot;)];
      buttons.forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; {
        const selected = button.dataset.guidePage;
        buttons.forEach((item) =&gt; item.toggleAttribute(&quot;aria-current&quot;, item === button));
        panels.forEach((panel) =&gt; { panel.toggleAttribute(&quot;hidden&quot;, panel.dataset.guidePanel !== selected); });
      }));

  const skipDelay = 300;

  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;

      getContent(trigger).length === 0 ||
