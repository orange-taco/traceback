services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - db
    env_file:
      - ${APP_ENV_FILE:-.env}
    networks:
      - backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${TRACEBACK_POSTGRES_DB:-traceback}
      POSTGRES_USER: ${TRACEBACK_POSTGRES_USER:-traceback}
      POSTGRES_PASSWORD: ${TRACEBACK_POSTGRES_PASSWORD:-development-only}
    networks:
      - backend
    ports:
      - "${TRACEBACK_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  backend:

volumes:
  postgres_data:
