services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env}
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${TRACEBACK_POSTGRES_DB:-traceback}
      POSTGRES_USER: ${TRACEBACK_POSTGRES_USER:-traceback}
      POSTGRES_PASSWORD: ${TRACEBACK_POSTGRES_PASSWORD:-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    ports:
      - "${TRACEBACK_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  backend:

volumes:
  postgres_data:
