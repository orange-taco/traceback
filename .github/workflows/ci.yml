name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-gate:
    name: Release branch gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require development source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: test "$HEAD_REF" = development

  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      APP_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.10.4"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run yamllint .
      - run: docker compose --env-file .env.example config --quiet
      - env:
          APP_IMAGE: traceback-production:ci
          APP_ENV_FILE: config/ci-production.env
        run: docker compose --env-file config/ci-production.env -f docker-compose.yml -f docker-compose_prod.yml config --quiet
      - run: docker build --target production -t traceback-production:ci .
      - name: Smoke test production container
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          APP_IMAGE: traceback-production:ci
          APP_ENV_FILE: config/ci-production.env
        run: |
          docker compose --env-file config/ci-production.env -f docker-compose.yml -f docker-compose_prod.yml up -d --no-build
          docker compose --env-file config/ci-production.env -f docker-compose.yml -f docker-compose_prod.yml exec -T app python manage.py migrate --noinput
          docker compose --env-file config/ci-production.env -f docker-compose.yml -f docker-compose_prod.yml up -d --no-build --wait
      - name: Show production container logs
        if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          APP_IMAGE: traceback-production:ci
          APP_ENV_FILE: config/ci-production.env
        run: docker compose --env-file config/ci-production.env -f docker-compose.yml -f docker-compose_prod.yml logs --no-color
      - name: Stop production container
        if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          APP_IMAGE: traceback-production:ci
          APP_ENV_FILE: config/ci-production.env
        run: docker compose --env-file config/ci-production.env -f docker-compose.yml -f docker-compose_prod.yml down -v

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: traceback
          POSTGRES_USER: traceback
          POSTGRES_PASSWORD: traceback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceback -d traceback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TRACEBACK_DATABASE_URL: postgresql://traceback:traceback@localhost:5432/traceback
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.10.4"
      - run: uv sync --frozen --all-groups
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py migrate --check
      - run: uv run pytest

  deploy-development:
    name: Deploy development
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: [quality, test]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-development.yml

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, test]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-production.yml
