name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.10.4"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose_dev.yml config --quiet
      - run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose_prod.yml config --quiet
      - run: docker build --target production .

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: traceback
          POSTGRES_USER: traceback
          POSTGRES_PASSWORD: traceback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceback -d traceback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://traceback:traceback@localhost:5432/traceback
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.10.4"
      - run: uv sync --locked --all-groups
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  production-smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose_prod.yml up -d --build --wait
      - if: always()
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose_prod.yml logs --no-color
      - if: always()
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose_prod.yml down -v
