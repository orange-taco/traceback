name: Deploy development

on:
  push:
    branches:
      - development

concurrency:
  group: development-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish development image
    runs-on: ubuntu-latest
    environment: development
    outputs:
      image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy development EC2
    needs: publish
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - env:
          APP_IMAGE: ${{ needs.publish.outputs.image }}
          INSTANCE_ID: ${{ vars.DEVELOPMENT_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters commands="[
                \"cd /opt/traceback\",
                \"docker compose version --short\",
                \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${APP_IMAGE%%/*}\",
                \"compose_cmd='docker compose --env-file .env -f docker-compose.yml -f docker-compose_prod.yml'\",
                \"APP_IMAGE=$APP_IMAGE \$compose_cmd pull app\",
                \"APP_IMAGE=$APP_IMAGE \$compose_cmd run --rm app python manage.py migrate --noinput\",
                \"APP_IMAGE=$APP_IMAGE \$compose_cmd up -d --no-build --wait app\"
              ]" \
              --query 'Command.CommandId' \
              --output text
          )"
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"
