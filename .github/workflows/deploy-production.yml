name: Deploy production

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy production EC2
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Resolve image deployed to development
        id: image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha="$(git merge-base HEAD origin/development)"
          test -n "$source_sha"
          dev_deploy_succeeded="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow deploy-development.yml \
            --commit "$source_sha" \
            --json conclusion \
            --jq 'any(.[]; .conclusion == "success")')"
          test "$dev_deploy_succeeded" = true
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$source_sha" \
            --query 'imageDetails[0].imageDigest' --output text)"
          test -n "$digest"
          test "$digest" != None
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "uri=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"
      - env:
          APP_IMAGE: ${{ steps.image.outputs.uri }}
          INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash .github/scripts/deploy-ec2.sh
