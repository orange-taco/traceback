[project]
name = "traceback-backend"
version = "0.1.0"
description = "TRACEBACK commerce backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "dj-database-url>=2.3,<3",
    "djangorestframework>=3.16,<4",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.30,<0.36",
    "uvicorn-worker>=0.3,<0.4",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2,<6",
    "djangorestframework-stubs[compatible-mypy]>=3.16,<4",
    "mypy>=1.16,<2",
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["apps"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]

[tool.ruff.lint.per-file-ignores]
"config/settings/development.py" = ["F403", "F405"]
"config/settings/production.py" = ["F403"]
"config/settings/test.py" = ["E402", "F403"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["config.settings.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
